<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realm Shift</title><style>body{margin:0;background:#101c25;color:#f4ecd8;font:16px system-ui}header,#hud{padding:14px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}header{background:#233b40;justify-content:space-between}button{padding:12px;border:0;border-radius:12px;background:#b9d69e;color:#152519;font-weight:700}main{position:relative}canvas{width:100%;height:60vh;max-height:600px;display:block;touch-action:none;background:#33583e}#pad{position:absolute;bottom:24px;left:24px;width:110px;height:110px;border-radius:100%;border:2px solid #fff8;background:#fff3;touch-action:none}#nub{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:100%;background:#d4efc9}#msg{padding:0 14px;min-height:45px}</style><header><b>🌌 REALM SHIFT</b><span id="stats">🪵 0 · 💎 0</span></header><main><canvas id="game"></canvas><div id="pad"><div id="nub"></div></div></main><div id="hud"><button id="build">🏠 Build (10 wood)</button><button id="pet">🐉 Dragon (5 gems)</button><button id="battle">⚔️ Battle (2 gems)</button><button id="gps">📍 GPS: Off</button><span id="distance">0 m traveled</span></div><p id="msg">Use the joystick to explore and collect trees and crystals.</p><p style="padding:0 14px;font-size:12px">Early single-player prototype. Fantasy paths are fictional, not real street data. Only interact with the screen when safely stopped. GPS requires permission and HTTPS.</p><script>
const c=document.querySelector('#game'),g=c.getContext('2d'),stats=document.querySelector('#stats'),msg=document.querySelector('#msg'),dist=document.querySelector('#distance');let W,H,p={x:0,y:0},wood=0,gems=0,dragon=false,homes=[],meters=0,watch=null,last=null;const things=Array.from({length:160},(_,i)=>({x:Math.sin(i*73.21)*1400,y:Math.cos(i*39.17)*1400,t:i%4===0?'gem':'tree',got:false}));function resize(){const d=devicePixelRatio||1;W=c.clientWidth;H=c.clientHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();let joy={x:0,y:0};const pad=document.querySelector('#pad'),nub=document.querySelector('#nub');function setJoy(e){const r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,n=Math.hypot(x,y)||1;joy={x:x/n*Math.min(n/40,1),y:y/n*Math.min(n/40,1)};nub.style.transform='translate('+joy.x*36+'px,'+joy.y*36+'px)'}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);setJoy(e)});pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))setJoy(e)});function stop(){joy={x:0,y:0};nub.style.transform=''}pad.addEventListener('pointerup',stop);pad.addEventListener('pointercancel',stop);const keys=new Set();addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){keys.add(e.key);e.preventDefault()}});addEventListener('keyup',e=>keys.delete(e.key));function hud(){stats.textContent='🪵 '+wood+' · 💎 '+gems+(dragon?' · 🐉':'');dist.textContent=Math.round(meters)+' m traveled'}function draw(){let x=joy.x+Number(keys.has('d')||keys.has('ArrowRight'))-Number(keys.has('a')||keys.has('ArrowLeft')),y=joy.y+Number(keys.has('s')||keys.has('ArrowDown'))-Number(keys.has('w')||keys.has('ArrowUp')),n=Math.hypot(x,y);if(n){p.x+=x/n*2.6;p.y+=y/n*2.6}let ox=W/2-p.x,oy=H/2-p.y;g.fillStyle='#31583d';g.fillRect(0,0,W,H);g.beginPath();for(let i=-1700;i<=1700;i+=20){let xx=i+ox,yy=Math.sin(i/170)*95+oy;i===-1700?g.moveTo(xx,yy):g.lineTo(xx,yy)}g.strokeStyle='#c4ac80';g.lineWidth=36;g.stroke();g.strokeStyle='#e9d6a6';g.lineWidth=3;g.stroke();g.textAlign='center';for(let a of things){if(a.got)continue;let xx=a.x+ox,yy=a.y+oy;if(xx>-40&&xx<W+40&&yy>-40&&yy<H+40){g.font='28px system-ui';g.fillText(a.t==='tree'?'🌲':'💎',xx,yy)}if(Math.hypot(a.x-p.x,a.y-p.y)<32){a.got=true;a.t==='tree'?wood+=2:gems++;msg.textContent=a.t==='tree'?'Collected wood! 🪵':'Found a crystal! 💎';hud()}}for(let h of homes){g.font='42px system-ui';g.fillText('🏠',h.x+ox,h.y+oy)}if(dragon){g.font='26px system-ui';g.fillText('🐉',W/2-36,H/2+29)}g.font='34px system-ui';g.fillText('🧙',W/2,H/2+12);requestAnimationFrame(draw)}draw();document.querySelector('#build').onclick=()=>{if(wood<10){msg.textContent='Collect 10 wood first.';return}wood-=10;homes.push({x:p.x+85,y:p.y-55});msg.textContent='Cottage built! 🏠';hud()};document.querySelector('#pet').onclick=()=>{if(dragon){msg.textContent='Your dragon is already here!';return}if(gems<5){msg.textContent='Collect 5 gems first.';return}gems-=5;dragon=true;msg.textContent='Dragon recruited! 🐉';hud()};document.querySelector('#battle').onclick=()=>{if(gems<2){msg.textContent='Need 2 gems to battle.';return}gems-=2;if(Math.random()>.35){wood+=12;gems+=3;msg.textContent='🏆 Victory! +12 wood and +3 gems'}else msg.textContent='⚔️ Defeat. Try again!';hud()};const b=document.querySelector('#gps');b.onclick=()=>{if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null;last=null;b.textContent='📍 GPS: Off';return}if(!navigator.geolocation){msg.textContent='GPS unavailable.';return}watch=navigator.geolocation.watchPosition(e=>{const q={lat:e.coords.latitude,lon:e.coords.longitude,t:e.timestamp};if(last&&e.coords.accuracy<60){let r=Math.PI/180,a=Math.sin((q.lat-last.lat)*r/2)**2+Math.cos(q.lat*r)*Math.cos(last.lat*r)*Math.sin((q.lon-last.lon)*r/2)**2,d=12742000*Math.asin(Math.min(1,Math.sqrt(a)));if(d>2&&d<100&&d/Math.max(1,(q.t-last.t)/1000)<20){meters+=d;p.x+=d;hud()}}last=q;msg.textContent='GPS active. Watch your surroundings.'},e=>{msg.textContent='GPS: '+e.message;b.textContent='📍 GPS: Off';watch=null},{enableHighAccuracy:true,maximumAge:3000,timeout:15000});b.textContent='📍 GPS: On'};hud();
</script></html>
